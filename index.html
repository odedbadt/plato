<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Museum of polyhedra</title>
  <link type="text/css" rel="stylesheet" href="static/style.css">
  <link rel="icon" type="image/x-icon" href="static/favicon.png">
  <script src="./bundle.js" defer></script>
</head>

<body>
  <canvas id="mainCanvas"></canvas>
  <canvas id="textureCanvas"></canvas>

  <!-- Toggle button for controls -->
  <button id="controls-toggle">☰</button>

  <!-- Floating clear button -->
  <button id="clear-btn" class="floating-btn" title="Clear drawing">
    <svg viewBox="0 0 20 20" fill="white" xmlns="http://www.w3.org/2000/svg">
      <rect x="7" y="2" width="6" height="2" rx="1"/>
      <rect x="3" y="4" width="14" height="2" rx="1"/>
      <path d="M5 7h10l-1 10H6L5 7z" fill="white"/>
    </svg>
  </button>

  <!-- Floating model picker button -->
  <button id="model-picker-btn" class="floating-btn" title="Choose model">
    <svg viewBox="0 0 20 20" fill="white" xmlns="http://www.w3.org/2000/svg">
      <rect x="2"  y="2"  width="7" height="7" rx="1.5"/>
      <rect x="11" y="2"  width="7" height="7" rx="1.5"/>
      <rect x="2"  y="11" width="7" height="7" rx="1.5"/>
      <rect x="11" y="11" width="7" height="7" rx="1.5"/>
    </svg>
  </button>

  <!-- Floating wireframe toggle -->
  <button id="wireframe-btn" class="floating-btn" title="Wireframe mode">
    <svg viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.2" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 1.5 L18 6 L18 14 L10 18.5 L2 14 L2 6 Z"/>
      <path d="M10 1.5 L10 18.5 M2 6 L18 14 M18 6 L2 14"/>
    </svg>
  </button>

  <!-- Model picker modal -->
  <div id="model-picker-overlay" class="hidden">
    <div id="model-picker-modal">
      <div id="model-picker-grid"></div>
    </div>
  </div>
  <!-- Controls panel -->
  <div id="controls-panel" class="hidden">
    <div id="buttons">
      <div class="color color-1"></div>
      <div class="color color-2"></div>
      <div class="color color-3"></div>
      <div class="color color-4"></div>
      <div class="color color-5"></div>
      <div class="color color-6"></div>
      <div class="color color-7"></div>
      <div class="color color-8"></div>
      <div class="color color-9"></div>
      <div class="color color-10"></div>
      <div class="color color-11"></div>
      <div class="color color-12"></div>
      <div class="color color-13"></div>
      <div class="color color-14"></div>
      <div class="color color-15"></div>
      <div class="color color-16"></div>
      <div class="action action-1 pen-size pen-size-1">
        <svg viewBox="0 0 20 20" style="background-color:white;border: 1px solid #ccc;">
          <circle cx="10" cy="10" r="1" fill="black" />
        </svg>
      </div>
      <div class="action action-2 pen-size pen-size-2">
        <svg viewBox="0 0 20 20" style="background-color:white;border: 1px solid #ccc;">
          <circle cx="10" cy="10" r="5" fill="black" />
        </svg>
      </div>
      <div class="action action-3 pen-size pen-size-25">
        <svg viewBox="0 0 20 20" style="background-color:white;border: 1px solid #ccc;">
          <circle cx="10" cy="10" r="10" fill="black" />
        </svg>
      </div>
      <div class="action action-4" id="floodfill">
        <svg viewBox="0 0 20 20" style="background-color:white;border: 1px solid #ccc;">
          <path d="M3 14 Q2 17 5 17 Q8 17 7 14 L5 7 Z" fill="black"/>
          <path d="M5 7 L13 3 L16 9 L8 13 Z" fill="black"/>
          <circle cx="15" cy="15" r="4" fill="black"/>
          <circle cx="15" cy="15" r="2.5" fill="white"/>
        </svg>
      </div>
      <div id="clear-canvas-button" class="action action-5"></div>
      <input type="color" id="color-picker" class="action" value="#ff0000">
    </div>
    <div id="v-div-1">
      <div id="model-select-container"></div>
      <fieldset id="symmetry-options">
        <legend>Mirror angles:</legend>
        <div id="triple-row">
          <span class="triple-pi">&#960;/</span>
          <input type="number" id="triple-x" min="2" max="24" step="1" value="5">
          <input type="number" id="triple-y" min="2" max="24" step="1" value="3">
          <input type="number" id="triple-z" min="2" max="24" step="1" value="2">
        </div>
        <div id="triple-note"></div>
      </fieldset>
      <fieldset id="plane-options" style="display:none">
        <legend>Plane:</legend>
        <div class="hyperbolic-only">
          <select id="hyper-projection"></select>
        </div>
        <div class="slider-row hyperbolic-only">
          <label for="hyper-cutoff">Depth</label>
          <input type="range" id="hyper-cutoff" min="0.8" max="0.995" step="0.005" value="0.95">
        </div>
        <div class="slider-row euclidean-only">
          <label for="euclid-scale">Cell size</label>
          <input type="range" id="euclid-scale" min="0.05" max="0.8" step="0.01" value="0.22">
        </div>
        <div>
          <input type="checkbox" id="plane-checker" name="plane-checker" checked>
          <label for="plane-checker">Checker the cells</label>
        </div>
        <div>
          <button type="button" id="plane-recentre">Recentre</button>
        </div>
        <div id="plane-status"></div>
      </fieldset>
      <fieldset id="rendering-options">
        <legend>Rendering options:</legend>
        <div>
          <input type="checkbox" id="model" checked=true name="model" value="model">
          <label for="model">Model</label>
        </div>
        <div>
          <input type="radio" id="generating-mirrors" name="mirrors" value="generating-mirrors">
          <label for="generating-mirrors">Generating mirrors only</label>
        </div>
        <div>
          <input type="radio" id="all-mirrors" name="mirrors" value="all-mirrors">
          <label for="all-mirrors">All mirrors</label>
        </div>
        <div>
          <input type="radio" id="no-mirrors" name="mirrors" value="no-mirrors">
          <label for="no-mirrors">No mirrors</label>
        </div>
      </fieldset>
      <fieldset id="shape-options">
        <legend>Shape:</legend>
        <div>
          <input type="checkbox" id="shape-seed-on" name="shape-seed-on" value="shape-seed-on">
          <label for="shape-seed-on">Seed point</label>
        </div>
        <div class="seed-sub">
          <canvas id="shape-seed-pad"></canvas>
          <div id="shape-seed-hint">Corners are the regular solids, edges the
            truncations, the middle the omnitruncated one.</div>
        </div>
        <div class="slider-row classic-sub spherical-only">
          <label for="shape-stellation">Stellation</label>
          <input type="range" id="shape-stellation" min="0.2" max="3" step="0.01" value="1">
        </div>
        <div class="slider-row spherical-only">
          <label for="shape-size">Size</label>
          <input type="range" id="shape-size" min="0.3" max="1.6" step="0.01" value="1">
        </div>
        <div class="slider-row spherical-only">
          <label for="shape-mirror-size">Mirror size</label>
          <input type="range" id="shape-mirror-size" min="0.3" max="1.6" step="0.01" value="1">
        </div>
        <div class="classic-sub spherical-only">
          <input type="checkbox" id="shape-dual" name="shape-dual" value="shape-dual">
          <label for="shape-dual">Dual</label>
        </div>
        <div class="classic-sub spherical-only">
          <input type="checkbox" id="shape-rhombic" name="shape-rhombic" value="shape-rhombic">
          <label for="shape-rhombic">Rhombic</label>
        </div>
        <div>
          <button type="button" id="shape-reset">Reset shape</button>
        </div>
      </fieldset>
      <fieldset id="wireframe-options">
        <legend>Wireframe:</legend>
        <div>
          <input type="checkbox" id="wireframe" name="wireframe" value="wireframe">
          <label for="wireframe">Wireframe</label>
        </div>
        <div class="wf-sub">
          <select id="wireframe-mode">
            <option value="uniform">Even lines</option>
            <option value="depth">Nearer edges heavier</option>
            <option value="depth-halo" selected>Nearer edges heavier + breaks</option>
          </select>
        </div>
        <div class="wf-sub">
          <input type="checkbox" id="wf-hide-back" name="wf-hide-back" value="wf-hide-back">
          <label for="wf-hide-back">Hide edges round the back</label>
        </div>
        <div class="slider-row wf-sub">
          <label for="wf-weight">Line weight</label>
          <input type="range" id="wf-weight" min="0.4" max="2.5" step="0.1" value="1">
        </div>
      </fieldset>
    </div>
  </div>
  <div id="shape-name" style="display:none"></div>

  <script>
    document.getElementById('controls-toggle').addEventListener('click', function() {
      document.getElementById('controls-panel').classList.toggle('hidden');
    });
  </script>
</body>

</html>
